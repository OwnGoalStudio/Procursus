name: Build patched Git

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "makefiles/git.mk"
      - ".github/patches/git-shell-path.patch"
      - ".github/workflows/build-git.yml"

permissions:
  contents: read

concurrency:
  group: build-git-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.variant }}
    runs-on: macos-15-intel
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: rootless
            repository: OwnGoalStudio/Procursus
            ref: main
            target: iphoneos-arm64-rootless
          - variant: roothide
            repository: roothide/Procursus-roothide
            ref: main
            target: iphoneos-arm64-roothide

    steps:
      - name: Check out CI configuration
        uses: actions/checkout@v4
        with:
          path: ci
          persist-credentials: false

      - name: Check out ${{ matrix.variant }} sources
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.ref }}
          path: source
          persist-credentials: false

      - name: Apply shell-path fix
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          patch_file="../ci/.github/patches/git-shell-path.patch"
          if git apply --check "$patch_file"; then
            git apply "$patch_file"
          else
            git apply --reverse --check "$patch_file"
          fi
          grep -F 'SHELL_PATH=$(MEMO_PREFIX)$(MEMO_SUB_PREFIX)/bin/sh' makefiles/git.mk

      - name: Install Procursus build environment
        shell: bash
        run: |
          set -euo pipefail
          brew install zstd
          curl --fail --location --retry 3 \
            https://apt.procurs.us/bootstraps/big_sur/bootstrap-darwin-amd64.tar.zst \
            --output "$RUNNER_TEMP/procursus-bootstrap.tar.zst"
          echo "b80523843ebd8d990a204a70b403472fd66e32797f2357061b1c080f01e15aa6  $RUNNER_TEMP/procursus-bootstrap.tar.zst" | shasum -a 256 --check
          "$(brew --prefix zstd)/bin/zstd" --decompress --stdout "$RUNNER_TEMP/procursus-bootstrap.tar.zst" \
            | sudo tar -xpf - -C / ./opt/procursus
          # The legacy bootstrap's apt-key helper does not run on current macOS.
          # Packages are still fetched over HTTPS from the pinned bootstrap's source.
          sudo /opt/procursus/bin/apt-get \
            -o Acquire::AllowInsecureRepositories=true update
          sudo /opt/procursus/bin/apt-get install -y --allow-unauthenticated \
            autoconf automake autopoint bash bison cmake curl docbook-xml \
            docbook-xsl fakeroot findutils flex gawk git gnupg grep groff \
            gzip ldid libtool make ncurses-bin openssl patch pkg-config \
            po4a python3 sed tar triehash xz-utils zstd

      - name: Install Roothide host rewriter
        if: matrix.variant == 'roothide'
        shell: bash
        run: |
          set -euo pipefail
          commit="7764c54759009272b4f2f23c18c62b21794fe6dd"
          for file in symredirect.cpp vroot.h; do
            curl --fail --location --retry 3 \
              "https://raw.githubusercontent.com/roothide/libroothide/${commit}/${file}" \
              --output "$RUNNER_TEMP/${file}"
          done
          xcrun clang++ -std=c++11 \
            "$RUNNER_TEMP/symredirect.cpp" -o "$RUNNER_TEMP/symredirect"
          sudo install -m 0755 "$RUNNER_TEMP/symredirect" /usr/local/bin/symredirect

      - name: Build Git package
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          umask 022
          export PATH="/opt/procursus/bin:/opt/procursus/libexec/gnubin:$PATH"
          /opt/procursus/bin/gmake -j"$(sysctl -n hw.logicalcpu)" \
            MEMO_TARGET="${{ matrix.target }}" \
            MEMO_CFVER=1900 \
            NO_PGP=1 \
            git-package

      - name: Inspect package metadata
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          deb="$(find build_dist -type f -path '*/git/*.deb' -print -quit)"
          test -n "$deb"
          /opt/procursus/bin/dpkg-deb --info "$deb"
          /opt/procursus/bin/dpkg-deb --contents "$deb"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: git-${{ matrix.variant }}
          path: source/build_dist/**/git/*.deb
          if-no-files-found: error
          retention-days: 14
